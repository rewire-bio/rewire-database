name: Database checks and independent frontend deployment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_full:
        description: Recheck current data and redeploy the backend, image and Worker
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  # Pull requests: tests and lint, the production build plus its bounded SSR
  # check, and the API. The build embeds the pinned release, so PRs build
  # exactly what publication builds; only publication touches production.
  pr-tests:
    concurrency:
      group: database-pr-tests-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read the reviewed data pin
        id: data-pin
        run: |
          node -e 'const p=require("./benchmark-data.lock.json"); if(p.repository!=="rewire-bio/rewire-benchmark-data" || !/^[a-f0-9]{40}$/.test(p.revision) || !/^\d{4}-\d{2}-\d{2}-[a-f0-9]{12}$/.test(p.release_id)) throw Error("Invalid data pin"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "revision="+p.revision+"\nrelease_id="+p.release_id+"\n")'
      - name: Restore current-release-only data checkout
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: workbench/benchmark-data
          key: benchmark-data-current-v2-${{ steps.data-pin.outputs.revision }}-${{ hashFiles('benchmark-data.lock.json') }}
      - name: Check out only the current release's website files
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: rewire-bio/rewire-benchmark-data
          ref: ${{ steps.data-pin.outputs.revision }}
          persist-credentials: false
          path: workbench/benchmark-data
          sparse-checkout-cone-mode: false
          sparse-checkout: /website/manifest.json
      - name: Select exact current payloads from the authenticated manifest
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: node scripts/select-current-data.mjs
      - run: npm run data:prepare -- --current-only
      - name: Cache the current-release-only checkout
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: workbench/benchmark-data
          key: benchmark-data-current-v2-${{ steps.data-pin.outputs.revision }}-${{ hashFiles('benchmark-data.lock.json') }}
      - run: npm run test:ui:coverage

  pr-quality:
    # Lint and type checks run beside the tests and the build.
    concurrency:
      group: database-pr-quality-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read the reviewed data pin
        id: data-pin
        run: |
          node -e 'const p=require("./benchmark-data.lock.json"); if(p.repository!=="rewire-bio/rewire-benchmark-data" || !/^[a-f0-9]{40}$/.test(p.revision)) throw Error("Invalid data pin"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "revision="+p.revision+"\n")'
      - name: Restore current-release-only data checkout
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: workbench/benchmark-data
          key: benchmark-data-current-v2-${{ steps.data-pin.outputs.revision }}-${{ hashFiles('benchmark-data.lock.json') }}
      - name: Check out only the current release's website files
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: rewire-bio/rewire-benchmark-data
          ref: ${{ steps.data-pin.outputs.revision }}
          persist-credentials: false
          path: workbench/benchmark-data
          sparse-checkout-cone-mode: false
          sparse-checkout: /website/manifest.json
      - name: Select exact current payloads from the authenticated manifest
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: node scripts/select-current-data.mjs
      - run: npm run data:prepare -- --current-only
      - run: npm run lint
      - run: npm run typecheck
  pr-build:
    concurrency:
      group: database-pr-build-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Restore Next compilation cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-node24-next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-next-${{ hashFiles('package-lock.json') }}-
      - name: Read the reviewed data pin
        id: data-pin
        run: |
          node -e 'const p=require("./benchmark-data.lock.json"); if(p.repository!=="rewire-bio/rewire-benchmark-data" || !/^[a-f0-9]{40}$/.test(p.revision)) throw Error("Invalid data pin"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "revision="+p.revision+"\n")'
      - name: Restore current-release-only data checkout
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: workbench/benchmark-data
          key: benchmark-data-current-v2-${{ steps.data-pin.outputs.revision }}-${{ hashFiles('benchmark-data.lock.json') }}
      - name: Check out only the current release's website files
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: rewire-bio/rewire-benchmark-data
          ref: ${{ steps.data-pin.outputs.revision }}
          persist-credentials: false
          path: workbench/benchmark-data
          sparse-checkout-cone-mode: false
          sparse-checkout: /website/manifest.json
      - name: Select exact current payloads from the authenticated manifest
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: node scripts/select-current-data.mjs
      - name: Build the standalone frontend and check it over HTTP
        run: |
          npm run build
          npm run check:build

  pr-api:
    concurrency:
      group: database-pr-api-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/omics/package-lock.json
      - run: npm ci --prefix services/omics --no-audit --no-fund
      - name: Build and test API against tracked fixtures
        run: |
          npm --prefix services/omics run build
          npm --prefix services/omics test

  checks:
    concurrency:
      group: database-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_METRICS_FILE: workbench/build-metrics.jsonl
      NODE_OPTIONS: --max-old-space-size=8192
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      OMICS_CONTRIBUTIONS_ENABLED: ${{ vars.OMICS_CONTRIBUTIONS_ENABLED || 'false' }}
      OMICS_MAIL_ENABLED: ${{ vars.OMICS_MAIL_ENABLED || 'false' }}
      NEXT_PUBLIC_OMICS_CONTRIBUTIONS_ENABLED: ${{ vars.NEXT_PUBLIC_OMICS_CONTRIBUTIONS_ENABLED || 'false' }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require automatic public deployment configuration
        if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && vars.FIREBASE_BACKEND_DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_PUBLIC_ORIGIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUD_RUN_IMAGE_REPOSITORY: ${{ vars.CLOUD_RUN_IMAGE_REPOSITORY }}
          CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_PUBLIC_ORIGIN" ] || [ -z "$CLOUD_RUN_IMAGE_REPOSITORY" ] || [ -z "$CLOUD_RUN_SERVICE_ACCOUNT" ]; then
            echo '::error::Publication requires CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, CLOUDFLARE_PUBLIC_ORIGIN, CLOUD_RUN_IMAGE_REPOSITORY and CLOUD_RUN_SERVICE_ACCOUNT. See docs/independent-frontend.md.'
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - name: Read the reviewed data pin
        id: data-pin
        run: |
          node -e 'const p=require("./benchmark-data.lock.json"); if(p.repository!=="rewire-bio/rewire-benchmark-data" || !/^[a-f0-9]{40}$/.test(p.revision)) throw Error("Invalid data pin"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "revision="+p.revision+"\n")'
      - name: Restore current-release website files
        id: current-data-cache
        uses: actions/cache/restore@v4
        with:
          path: workbench/benchmark-data
          key: benchmark-data-current-v2-${{ steps.data-pin.outputs.revision }}-${{ hashFiles('benchmark-data.lock.json') }}
      - name: Check out the current release manifest
        if: steps.current-data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: rewire-bio/rewire-benchmark-data
          ref: ${{ steps.data-pin.outputs.revision }}
          persist-credentials: false
          path: workbench/benchmark-data
          sparse-checkout-cone-mode: false
          sparse-checkout: /website/manifest.json
      - name: Select SHA-verified current payloads
        if: steps.current-data-cache.outputs.cache-hit != 'true'
        run: node scripts/select-current-data.mjs
      - name: Hydrate and verify only the pinned current release
        run: node scripts/deployment-metrics.mjs run hydration -- npm run data:prepare -- --current-only
      - name: Cache verified current-release files
        if: steps.current-data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: workbench/benchmark-data
          key: ${{ steps.current-data-cache.outputs.cache-primary-key }}
      # After hydration: the frontend fingerprint includes the compiled taxonomy.
      - name: Select publication work from the last live receipt
        id: plan
        run: node scripts/deployment-plan.mjs
        env:
          FORCE_FULL: ${{ inputs.force_full || 'false' }}
      - name: Restore Next compilation cache
        id: next-cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-node24-next-${{ hashFiles('package-lock.json') }}-${{ steps.plan.outputs.compiler_env }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node24-next-${{ hashFiles('package-lock.json') }}-${{ steps.plan.outputs.compiler_env }}-
      - name: Validate configuration and build the standalone frontend
        run: |
          node scripts/check-analytics-config.mjs
          node scripts/configure-contribution-deployment.mjs --validate-only
          node scripts/deployment-metrics.mjs run build -- node scripts/build-web.mjs
          node scripts/deployment-plan.mjs --receipt
      - name: Save Next compilation cache
        if: steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
      - name: Check the production server over HTTP and the release data
        run: node scripts/deployment-metrics.mjs run ssr_verification -- npm run check:build
      - name: Package the checked frontend and release identity
        run: node scripts/deployment-metrics.mjs run artifact_pack -- node scripts/publication-artifact.mjs pack
      - name: Retain checked publication for the serialized publisher
        uses: actions/upload-artifact@v4
        with:
          name: checked-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: workbench/publication
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Summarize build timings
        if: always()
        run: node scripts/deployment-metrics.mjs summary

  main-tests:
    # Runs beside checks; publish waits for it.
    concurrency:
      group: database-main-tests-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read the reviewed data pin
        id: data-pin
        run: |
          node -e 'const p=require("./benchmark-data.lock.json"); if(p.repository!=="rewire-bio/rewire-benchmark-data" || !/^[a-f0-9]{40}$/.test(p.revision)) throw Error("Invalid data pin"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "revision="+p.revision+"\n")'
      - name: Restore current-release-only data checkout
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: workbench/benchmark-data
          key: benchmark-data-current-v2-${{ steps.data-pin.outputs.revision }}-${{ hashFiles('benchmark-data.lock.json') }}
      - name: Check out only the current release's website files
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: rewire-bio/rewire-benchmark-data
          ref: ${{ steps.data-pin.outputs.revision }}
          persist-credentials: false
          path: workbench/benchmark-data
          sparse-checkout-cone-mode: false
          sparse-checkout: /website/manifest.json
      - name: Select exact current payloads from the authenticated manifest
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: node scripts/select-current-data.mjs
      - run: npm run data:prepare -- --current-only
      - run: npm run test:ui:coverage
  main-quality:
    # Runs beside checks; publish waits for it.
    concurrency:
      group: database-main-quality-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read the reviewed data pin
        id: data-pin
        run: |
          node -e 'const p=require("./benchmark-data.lock.json"); if(p.repository!=="rewire-bio/rewire-benchmark-data" || !/^[a-f0-9]{40}$/.test(p.revision)) throw Error("Invalid data pin"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "revision="+p.revision+"\n")'
      - name: Restore current-release-only data checkout
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: workbench/benchmark-data
          key: benchmark-data-current-v2-${{ steps.data-pin.outputs.revision }}-${{ hashFiles('benchmark-data.lock.json') }}
      - name: Check out only the current release's website files
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: rewire-bio/rewire-benchmark-data
          ref: ${{ steps.data-pin.outputs.revision }}
          persist-credentials: false
          path: workbench/benchmark-data
          sparse-checkout-cone-mode: false
          sparse-checkout: /website/manifest.json
      - name: Select exact current payloads from the authenticated manifest
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: node scripts/select-current-data.mjs
      - run: npm run data:prepare -- --current-only
      - run: npm run lint
      - run: npm run typecheck
  main-api:
    # Runs beside checks; publish waits for it.
    concurrency:
      group: database-main-api-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The same configuration the API steps had inside the checks job.
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      OMICS_CONTRIBUTIONS_ENABLED: ${{ vars.OMICS_CONTRIBUTIONS_ENABLED || 'false' }}
      OMICS_MAIL_ENABLED: ${{ vars.OMICS_MAIL_ENABLED || 'false' }}
      NEXT_PUBLIC_OMICS_CONTRIBUTIONS_ENABLED: ${{ vars.NEXT_PUBLIC_OMICS_CONTRIBUTIONS_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Install and build the API
        run: npm ci --prefix services/omics && npm --prefix services/omics run build && npm --prefix services/omics run check:functions:load
      - name: Verify submissions and curation in local emulators
        run: npx firebase emulators:exec --project demo-rewire-omics --only functions,auth,firestore 'npm --prefix services/omics test'
        env:
          OMICS_CONTRIBUTIONS_ENABLED: 'false'
          OMICS_MAIL_ENABLED: 'false'

  publish:
    # Publishes only after the build and every parallel check have passed.
    needs: [checks, main-tests, main-quality, main-api]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && vars.FIREBASE_BACKEND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      # Only this job writes production. Never cancel a transaction in progress.
      group: database-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOYMENT_METRICS_FILE: workbench/publication-metrics.jsonl
      NODE_OPTIONS: --max-old-space-size=8192
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      OMICS_CONTRIBUTIONS_ENABLED: ${{ vars.OMICS_CONTRIBUTIONS_ENABLED || 'false' }}
      OMICS_MAIL_ENABLED: ${{ vars.OMICS_MAIL_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: checked-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: workbench/checked-publication
      - name: Verify source and artifact before hydration
        run: node scripts/publication-artifact.mjs verify workbench/checked-publication
      - name: Restore the checked publication plan
        run: |
          cp workbench/checked-publication/workbench/deployment-plan.json workbench/deployment-plan.json
          node scripts/publication-queue-metrics.mjs
      - name: Reject superseded or stale publication before setup
        id: preflight
        run: node scripts/publication-preflight.mjs
      - name: Install pinned publication dependencies
        if: steps.preflight.outputs.publish == 'true'
        run: node scripts/deployment-metrics.mjs run dependencies -- npm ci --no-audit --no-fund
      - name: Read current publication data pin
        if: steps.preflight.outputs.publish == 'true'
        id: data-pin
        run: |
          node -e 'const p=require("./benchmark-data.lock.json"); if(p.repository!=="rewire-bio/rewire-benchmark-data" || !/^[a-f0-9]{40}$/.test(p.revision)) throw Error("Invalid data pin"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "revision="+p.revision+"\n")'
      - name: Restore current-release website files
        if: steps.preflight.outputs.publish == 'true'
        id: current-data-cache
        uses: actions/cache/restore@v4
        with:
          path: workbench/benchmark-data
          key: benchmark-data-current-v2-${{ steps.data-pin.outputs.revision }}-${{ hashFiles('benchmark-data.lock.json') }}
      - name: Check out the current release manifest
        if: steps.preflight.outputs.publish == 'true' && steps.current-data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: rewire-bio/rewire-benchmark-data
          ref: ${{ steps.data-pin.outputs.revision }}
          persist-credentials: false
          path: workbench/benchmark-data
          sparse-checkout-cone-mode: false
          sparse-checkout: /website/manifest.json
      - name: Select SHA-verified current payloads
        if: steps.preflight.outputs.publish == 'true' && steps.current-data-cache.outputs.cache-hit != 'true'
        run: node scripts/select-current-data.mjs
      - name: Hydrate the current release and its prepared file
        if: steps.preflight.outputs.publish == 'true'
        run: node scripts/deployment-metrics.mjs run publication_hydration -- npm run data:prepare -- --current-only
      - name: Restore the checked frontend and release identity
        if: steps.preflight.outputs.publish == 'true'
        run: node scripts/deployment-metrics.mjs run artifact_restore -- node scripts/publication-artifact.mjs restore workbench/checked-publication
      - name: Inspect whether the backend changed
        id: api-plan
        if: steps.preflight.outputs.publish == 'true'
        run: node scripts/deploy-independent-frontend.mjs --inspect
      - name: Build the pinned publication API tools
        if: steps.preflight.outputs.publish == 'true'
        run: npm ci --prefix services/omics --no-audit --no-fund && npm --prefix services/omics run build && npm --prefix services/omics run check:functions:load
      - name: Recheck source and live publication immediately before writes
        id: final-preflight
        if: steps.preflight.outputs.publish == 'true'
        run: node scripts/publication-preflight.mjs --refresh-ui-base
      # Cloud Run publication needs Google credentials.
      - name: Authenticate to Google
        if: steps.final-preflight.outputs.publish == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up gcloud and Artifact Registry pushes
        if: steps.final-preflight.outputs.publish == 'true'
        uses: google-github-actions/setup-gcloud@v2
      - name: Allow Docker to push to Artifact Registry
        if: steps.final-preflight.outputs.publish == 'true'
        run: gcloud auth configure-docker europe-west2-docker.pkg.dev --quiet
      - name: Check independent backend deployment state
        id: backend
        if: steps.final-preflight.outputs.publish == 'true' && steps.api-plan.outputs.backend_required == 'true'
        run: node scripts/backend-deployment.mjs
        env:
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          NODE_ENV: production
      - name: Deploy reviewed API and private Firestore rules
        if: steps.final-preflight.outputs.publish == 'true' && steps.backend.outputs.required == 'true'
        run: |
          node scripts/backend-deployment.mjs --begin
          node scripts/configure-contribution-deployment.mjs
          npx firebase deploy --only functions:omics,firestore --project "$FIREBASE_PROJECT_ID" --non-interactive
          node scripts/backend-deployment.mjs --complete
        env:
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          NODE_ENV: production
      - name: Publish the Cloud Run frontend and its embedded release with rollback
        if: steps.final-preflight.outputs.publish == 'true'
        run: node scripts/deployment-metrics.mjs run independent_publication -- node scripts/deploy-independent-frontend.mjs
        env:
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          NODE_ENV: production
          CLOUD_RUN_IMAGE_REPOSITORY: ${{ vars.CLOUD_RUN_IMAGE_REPOSITORY }}
          CLOUD_RUN_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_SERVICE_ACCOUNT }}
          CLOUD_RUN_MAX_INSTANCES: ${{ vars.CLOUD_RUN_MAX_INSTANCES || '3' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_PUBLIC_ORIGIN }}
      - name: Browser smoke test of the public website
        if: steps.final-preflight.outputs.publish == 'true'
        run: |
          npx playwright install --with-deps chromium
          npm run smoke:browser
        env:
          SMOKE_ORIGIN: ${{ vars.CLOUDFLARE_PUBLIC_ORIGIN || 'https://benchmarks.rewirebio.io' }}
      - name: Remove generated service environment
        if: always()
        run: rm -f services/omics/.env
      - name: Summarize publication timings
        if: always()
        run: node scripts/deployment-metrics.mjs summary
