name: Database checks and independent frontend deployment
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_full:
        description: Recheck current data and redeploy the backend
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  # Fast pull_request path: a small deterministic sample of pages (one fixed
  # published use case plus representatives of every entity kind and legacy
  # alias shape — see lib/smoke-selection.ts and
  # docs/pr-ci.md), not the full ~28,800-route
  # catalogue. Three independent lanes run in parallel, each budgeted to finish
  # well inside 5 minutes; `timeout-minutes` fails the job outright on
  # overrun rather than letting an incomplete run report success. Skips the
  # full-history disk cleanup, production receipt/live-network planning,
  # Cloudflare packaging/upload and Firebase/Java/workerd emulators that only
  # matter for an actual publish — those stay on the `checks` job below,
  # for push to main and workflow_dispatch. Publication is a separate serialized job.
  pr-tests:
    concurrency:
      group: database-pr-tests-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore installed root dependencies
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v2-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - name: Read the reviewed data pin
        id: data-pin
        run: |
          node -e 'const p=require("./benchmark-data.lock.json"); if(p.repository!=="rewire-bio/rewire-benchmark-data" || !/^[a-f0-9]{40}$/.test(p.revision) || !/^\d{4}-\d{2}-\d{2}-[a-f0-9]{12}$/.test(p.release_id)) throw Error("Invalid data pin"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "revision="+p.revision+"\nrelease_id="+p.release_id+"\n")'
      - name: Restore current-release-only data checkout
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: workbench/benchmark-data
          key: benchmark-data-current-v2-${{ steps.data-pin.outputs.revision }}-${{ hashFiles('benchmark-data.lock.json') }}
      - name: Check out only the current release's website files
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: rewire-bio/rewire-benchmark-data
          ref: ${{ steps.data-pin.outputs.revision }}
          persist-credentials: false
          path: workbench/benchmark-data
          sparse-checkout-cone-mode: false
          sparse-checkout: /website/manifest.json
      - name: Select exact current payloads from the authenticated manifest
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: node scripts/select-current-data.mjs
      - name: Report cache hits before spending the time budget on them
        run: |
          echo "node_modules cache hit: ${{ steps.node-modules-cache.outputs.cache-hit == 'true' }}"
          echo "current-release data cache hit: ${{ steps.data-cache.outputs.cache-hit == 'true' }}"
      - run: npm run data:prepare -- --current-only
      - name: Cache the current-release-only checkout
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: workbench/benchmark-data
          key: benchmark-data-current-v2-${{ steps.data-pin.outputs.revision }}-${{ hashFiles('benchmark-data.lock.json') }}
      - run: npm run test:ui:coverage
      - run: npm run lint
      - run: npm run typecheck
      - name: Report elapsed time
        if: always()
        run: |
          echo "pr-tests elapsed: $(( $(date +%s) - ${{ steps.start.outputs.epoch }} ))s (budget 300s)"

  pr-smoke:
    concurrency:
      group: database-pr-smoke-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Restore installed root dependencies
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node22-modules-v2-${{ hashFiles('package-lock.json') }}
      - run: npm ci --no-audit --no-fund
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
      - name: Restore Next compilation cache
        id: next-cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-node22-next-smoke-default-env-v2-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-next-smoke-default-env-v2-${{ hashFiles('package-lock.json') }}-
      - name: Read the reviewed data pin
        id: data-pin
        run: |
          node -e 'const p=require("./benchmark-data.lock.json"); if(p.repository!=="rewire-bio/rewire-benchmark-data" || !/^[a-f0-9]{40}$/.test(p.revision) || !/^\d{4}-\d{2}-\d{2}-[a-f0-9]{12}$/.test(p.release_id)) throw Error("Invalid data pin"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "revision="+p.revision+"\nrelease_id="+p.release_id+"\n")'
      - name: Restore current-release-only data checkout
        id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: workbench/benchmark-data
          key: benchmark-data-current-v2-${{ steps.data-pin.outputs.revision }}-${{ hashFiles('benchmark-data.lock.json') }}
      - name: Check out only the current release's website files
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: rewire-bio/rewire-benchmark-data
          ref: ${{ steps.data-pin.outputs.revision }}
          persist-credentials: false
          path: workbench/benchmark-data
          sparse-checkout-cone-mode: false
          sparse-checkout: /website/manifest.json
      - name: Select exact current payloads from the authenticated manifest
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: node scripts/select-current-data.mjs
      - name: Report cache hits before spending the time budget on them
        run: |
          echo "node_modules cache hit: ${{ steps.node-modules-cache.outputs.cache-hit == 'true' }}"
          echo "Next exact cache hit: ${{ steps.next-cache.outputs.cache-hit == 'true' }}"
          echo "Next requested key: ${{ steps.next-cache.outputs.cache-primary-key }}"
          echo "Next restored key (empty = cold): ${{ steps.next-cache.outputs.cache-matched-key }}"
          echo "current-release data cache hit: ${{ steps.data-cache.outputs.cache-hit == 'true' }}"
      - run: npm run build:smoke
      - run: npm run check:export:smoke
      - name: Cache the current-release-only checkout
        if: steps.data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: workbench/benchmark-data
          key: benchmark-data-current-v2-${{ steps.data-pin.outputs.revision }}-${{ hashFiles('benchmark-data.lock.json') }}
      - name: Save Next compilation cache
        if: steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
      - name: Report elapsed time
        if: always()
        run: |
          echo "pr-smoke elapsed: $(( $(date +%s) - ${{ steps.start.outputs.epoch }} ))s (budget 300s)"

  pr-api:
    concurrency:
      group: database-pr-api-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/omics/package-lock.json
      - name: Restore installed API dependencies
        id: api-cache
        uses: actions/cache@v4
        with:
          path: services/omics/node_modules
          key: ${{ runner.os }}-node22-api-modules-v2-${{ hashFiles('services/omics/package-lock.json') }}
      - run: npm ci --prefix services/omics --no-audit --no-fund
        if: steps.api-cache.outputs.cache-hit != 'true'
      - name: Build and test API against tracked fixtures
        run: |
          echo "API dependencies exact hit: ${{ steps.api-cache.outputs.cache-hit == 'true' }}"
          npm --prefix services/omics run build
          npm --prefix services/omics test
      - name: Report elapsed time
        if: always()
        run: |
          echo "pr-api elapsed: $(( $(date +%s) - ${{ steps.start.outputs.epoch }} ))s (budget 300s)"

  checks:
    concurrency:
      group: database-build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Several steps load the whole catalogue into memory: the static export
    # prerenders a page per record, and the export checks read the release
    # bundles. That needs more heap than Node allows itself by default.
    env:
      CLOUDFLARE_ASSET_LIMIT: ${{ vars.CLOUDFLARE_ASSET_LIMIT || '20000' }}
      DEPLOYMENT_METRICS_FILE: workbench/build-metrics.jsonl
      NODE_OPTIONS: --max-old-space-size=8192
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      OMICS_CONTRIBUTIONS_ENABLED: ${{ vars.OMICS_CONTRIBUTIONS_ENABLED || 'false' }}
      OMICS_MAIL_ENABLED: ${{ vars.OMICS_MAIL_ENABLED || 'false' }}
      NEXT_PUBLIC_OMICS_CONTRIBUTIONS_ENABLED: ${{ vars.NEXT_PUBLIC_OMICS_CONTRIBUTIONS_ENABLED || 'false' }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require automatic public deployment configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && vars.FIREBASE_BACKEND_DEPLOY_ENABLED == 'true'
        env:
          CLOUDFLARE_DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          CLOUDFLARE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_PUBLIC_ORIGIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$CLOUDFLARE_ASSET_LIMIT" != 100000 ]; then
            echo '::error::The complete current frontend exceeds 20,000 files. Confirm Workers Paid capacity and set CLOUDFLARE_ASSET_LIMIT=100000 before enabling this migration. No billing changes are made by this workflow.'
            exit 1
          fi
          if [ "$CLOUDFLARE_DEPLOY_ENABLED" != true ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_PUBLIC_ORIGIN" ]; then
            echo '::error::Public deployment requires CLOUDFLARE_DEPLOY_ENABLED=true, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_PUBLIC_ORIGIN and a durable CLOUDFLARE_API_TOKEN. Configure them before publishing.'
            exit 1
          fi
          node --input-type=module <<'NODE'
          const origin = new URL(process.env.CLOUDFLARE_PUBLIC_ORIGIN);
          if (origin.protocol !== 'https:' || origin.username || origin.password) throw Error('A public HTTPS origin is required');
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/rewire-database-web/deployments`, {
            headers: { Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` }, signal: AbortSignal.timeout(15000),
          });
          const body = await response.json();
          if (!response.ok || !body.success || !body.result?.deployments?.[0]?.versions?.length) throw Error('Cloudflare credentials must access the existing Worker rollback target');
          NODE
      - name: Select publication work from the last live receipt
        id: plan
        run: node scripts/deployment-plan.mjs
        env:
          FORCE_FULL: ${{ inputs.force_full || 'false' }}
      - name: Restore Next compilation cache
        id: next-cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-node22-next-${{ hashFiles('package-lock.json') }}-${{ steps.plan.outputs.compiler_env }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-node22-next-${{ hashFiles('package-lock.json') }}-${{ steps.plan.outputs.compiler_env }}-
      # Expanded historical exports are intentionally never cached.
      - run: |
          npm ci
          npm cache clean --force
      - name: Read the reviewed data pin
        id: data-pin
        run: |
          node -e 'const p=require("./benchmark-data.lock.json"); if(p.repository!=="rewire-bio/rewire-benchmark-data" || !/^[a-f0-9]{40}$/.test(p.revision)) throw Error("Invalid data pin"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "revision="+p.revision+"\n")'
      - name: Restore current-release website files
        id: current-data-cache
        uses: actions/cache/restore@v4
        with:
          path: workbench/benchmark-data
          key: benchmark-data-current-v2-${{ steps.data-pin.outputs.revision }}-${{ hashFiles('benchmark-data.lock.json') }}
      - name: Check out the current release manifest
        if: steps.current-data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: rewire-bio/rewire-benchmark-data
          ref: ${{ steps.data-pin.outputs.revision }}
          persist-credentials: false
          path: workbench/benchmark-data
          sparse-checkout-cone-mode: false
          sparse-checkout: /website/manifest.json
      - name: Select SHA-verified current payloads
        if: steps.current-data-cache.outputs.cache-hit != 'true'
        run: node scripts/select-current-data.mjs
      - name: Hydrate and verify only the pinned current release
        run: node scripts/deployment-metrics.mjs run hydration -- npm run data:prepare -- --current-only
      - name: Cache verified current-release files
        if: steps.current-data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: workbench/benchmark-data
          key: ${{ steps.current-data-cache.outputs.cache-primary-key }}
      - run: npm run test:ui:coverage
      - run: npm run lint
      - name: Validate contribution configuration and build website
        run: |
          node scripts/check-analytics-config.mjs
          node scripts/configure-contribution-deployment.mjs --validate-only
          df -h .
          df -i .
          node scripts/deployment-metrics.mjs run rendering -- npm run build:web
          df -h .
          df -i .
          node scripts/deployment-plan.mjs --receipt
      - run: npm run typecheck
      - name: Save Next compilation cache before cleanup
        if: steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
      - name: Release intermediate Next build space
        # Static hosting uses out/. Keep generated types, exports and archives.
        run: |
          rm -rf .next/server .next/cache
          df -h .
      - name: Verify exported website and release bytes
        run: |
          node scripts/deployment-metrics.mjs run export_verification -- npm run check:export:web
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_OMICS_CONTRIBUTIONS_ENABLED: ${{ vars.NEXT_PUBLIC_OMICS_CONTRIBUTIONS_ENABLED || 'false' }}
      - name: Stage and validate all current frontend pages
        run: npm run prepare:cloudflare && node scripts/check-cloudflare-local.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install and build the API
        run: npm ci --prefix services/omics && npm --prefix services/omics run build && npm --prefix services/omics run check:functions:load
      - name: Verify API and submission integration in local emulators
        run: npx firebase emulators:exec --project demo-rewire-omics --only hosting,functions,auth,firestore 'npm --prefix services/omics test && node scripts/check-api-hosting.mjs'
        env:
          # The HTTP probe explicitly verifies the disabled-intake contract.
          # Keep emulator settings independent of the production publication plan.
          OMICS_CONTRIBUTIONS_ENABLED: 'false'
          OMICS_MAIL_ENABLED: 'false'
      - name: Package checked publication without historical downloads
        run: node scripts/deployment-metrics.mjs run artifact_pack -- node scripts/publication-artifact.mjs pack
      - name: Retain checked publication for the serialized publisher
        uses: actions/upload-artifact@v4
        with:
          name: checked-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: workbench/publication
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Summarize build timings
        if: always()
        run: node scripts/deployment-metrics.mjs summary
      - name: Retain build timing receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: workbench/build-metrics.jsonl
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && vars.FIREBASE_BACKEND_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    concurrency:
      # Only this job writes production. Never cancel a transaction in progress.
      group: database-publication
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDFLARE_ASSET_LIMIT: ${{ vars.CLOUDFLARE_ASSET_LIMIT || '20000' }}
      DEPLOYMENT_METRICS_FILE: workbench/publication-metrics.jsonl
      NODE_OPTIONS: --max-old-space-size=8192
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      OMICS_CONTRIBUTIONS_ENABLED: ${{ vars.OMICS_CONTRIBUTIONS_ENABLED || 'false' }}
      OMICS_MAIL_ENABLED: ${{ vars.OMICS_MAIL_ENABLED || 'false' }}
      NEXT_PUBLIC_OMICS_CONTRIBUTIONS_ENABLED: ${{ vars.NEXT_PUBLIC_OMICS_CONTRIBUTIONS_ENABLED || 'false' }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
      NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: checked-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: workbench/checked-publication
      - name: Verify source and artifact before hydration
        id: artifact
        run: node scripts/publication-artifact.mjs verify workbench/checked-publication
      - name: Restore the checked publication plan
        run: |
          cp workbench/checked-publication/workbench/deployment-plan.json workbench/deployment-plan.json
          node scripts/publication-queue-metrics.mjs
      - name: Reject superseded or stale publication before setup
        id: preflight
        run: node scripts/publication-preflight.mjs
      - name: Install pinned publication dependencies
        if: steps.preflight.outputs.publish == 'true'
        run: node scripts/deployment-metrics.mjs run dependencies -- npm ci --no-audit --no-fund
      - name: Read current publication data pin
        if: steps.preflight.outputs.publish == 'true'
        id: data-pin
        run: |
          node -e 'const p=require("./benchmark-data.lock.json"); if(p.repository!=="rewire-bio/rewire-benchmark-data" || !/^[a-f0-9]{40}$/.test(p.revision)) throw Error("Invalid data pin"); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "revision="+p.revision+"\n")'
      - name: Restore current-release website files
        if: steps.preflight.outputs.publish == 'true'
        id: current-data-cache
        uses: actions/cache/restore@v4
        with:
          path: workbench/benchmark-data
          key: benchmark-data-current-v2-${{ steps.data-pin.outputs.revision }}-${{ hashFiles('benchmark-data.lock.json') }}
      - name: Check out the current release manifest
        if: steps.preflight.outputs.publish == 'true' && steps.current-data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: rewire-bio/rewire-benchmark-data
          ref: ${{ steps.data-pin.outputs.revision }}
          persist-credentials: false
          path: workbench/benchmark-data
          sparse-checkout-cone-mode: false
          sparse-checkout: /website/manifest.json
      - name: Select SHA-verified current payloads
        if: steps.preflight.outputs.publish == 'true' && steps.current-data-cache.outputs.cache-hit != 'true'
        run: node scripts/select-current-data.mjs
      - name: Hydrate only current API artifacts
        if: steps.preflight.outputs.publish == 'true'
        run: node scripts/deployment-metrics.mjs run publication_hydration -- npm run data:prepare -- --current-only
      - name: Restore checked UI and current release identity
        if: steps.preflight.outputs.publish == 'true'
        run: node scripts/deployment-metrics.mjs run artifact_restore -- node scripts/publication-artifact.mjs restore workbench/checked-publication --frontend-only
      - name: Inspect current API release without Google credentials
        id: api-plan
        if: steps.preflight.outputs.publish == 'true'
        run: node scripts/deploy-independent-frontend.mjs --inspect
      - name: Prepare verified independent frontend
        if: steps.preflight.outputs.publish == 'true'
        run: npm run prepare:cloudflare && node scripts/check-cloudflare-local.mjs
      - name: Build the pinned publication API tools
        if: steps.preflight.outputs.publish == 'true'
        run: npm ci --prefix services/omics --no-audit --no-fund && npm --prefix services/omics run build && npm --prefix services/omics run check:functions:load
      - name: Recheck source and live publication immediately before writes
        id: final-preflight
        if: steps.preflight.outputs.publish == 'true'
        run: node scripts/publication-preflight.mjs --refresh-ui-base
      - name: Authenticate to Google
        if: steps.final-preflight.outputs.publish == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && vars.FIREBASE_BACKEND_DEPLOY_ENABLED == 'true' && (steps.api-plan.outputs.data_required == 'true' || steps.api-plan.outputs.backend_required == 'true')
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Check independent backend deployment state
        id: backend
        if: steps.final-preflight.outputs.publish == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && vars.FIREBASE_BACKEND_DEPLOY_ENABLED == 'true' && (steps.api-plan.outputs.data_required == 'true' || steps.api-plan.outputs.backend_required == 'true')
        run: node scripts/backend-deployment.mjs
        env:
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          NODE_ENV: production
      - name: Deploy reviewed API and private Firestore rules
        if: steps.final-preflight.outputs.publish == 'true' && steps.backend.outputs.required == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && vars.FIREBASE_BACKEND_DEPLOY_ENABLED == 'true'
        run: |
          node scripts/backend-deployment.mjs --begin
          node scripts/configure-contribution-deployment.mjs
          npx firebase deploy --only functions:omics,firestore --project "$FIREBASE_PROJECT_ID" --non-interactive
          node scripts/backend-deployment.mjs --complete
        env:
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          NODE_ENV: production
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          OMICS_CONTRIBUTIONS_ENABLED: ${{ vars.OMICS_CONTRIBUTIONS_ENABLED || 'false' }}
          OMICS_MAIL_ENABLED: ${{ vars.OMICS_MAIL_ENABLED || 'false' }}
      - name: Publish current API data and independent frontend with rollback
        if: steps.final-preflight.outputs.publish == 'true'
        run: node scripts/deployment-metrics.mjs run independent_publication -- node scripts/deploy-independent-frontend.mjs
        env:
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
          NODE_ENV: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PUBLIC_ORIGIN: ${{ vars.CLOUDFLARE_PUBLIC_ORIGIN }}
      - name: Smoke test deployed public website
        if: steps.final-preflight.outputs.publish == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && vars.FIREBASE_BACKEND_DEPLOY_ENABLED == 'true'
        run: |
          npm run smoke:deployment -- "$SMOKE_ORIGIN" --independent-frontend
          npx playwright install --with-deps chromium
          npm run smoke:browser
        env:
          SMOKE_ORIGIN: ${{ vars.CLOUDFLARE_PUBLIC_ORIGIN || 'https://benchmarks.rewirebio.io' }}
      - name: Remove generated service environment
        if: always()
        run: rm -f services/omics/.env
      - name: Summarize publication timings
        if: always()
        run: node scripts/deployment-metrics.mjs summary
      - name: Retain publication timing receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: workbench/publication-metrics.jsonl
          retention-days: 7
          if-no-files-found: ignore
