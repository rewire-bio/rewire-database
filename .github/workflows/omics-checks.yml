name: Omics catalogue and contributions

on:
  pull_request:
    paths:
      - 'data/omics/**'
      - 'scripts/omics/**'
      - 'services/omics/**'
      - 'app/**'
      - 'app/sitemap.ts'
      - 'lib/omics*.ts'
      - 'lib/catalogue*.ts'
      - 'lib/baseline-coverage.ts'
      - 'components/catalogue/**'
      - 'components/SiteAnalytics.tsx'
      - 'tests/omics-*.test.ts'
      - 'tests/omics-*.test.tsx'
      - 'package*.json'
      - 'firebase.json'
      - 'scripts/check-hosting-http.mjs'
      - 'scripts/prepare-runner-space.mjs'
      - 'tsconfig.json'
      - '.github/workflows/omics-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    # Several steps load the whole catalogue into memory: the static export
    # prerenders a page per record, and the export checks read the release
    # bundles. That needs more heap than Node allows itself by default.
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - name: Free temporary runner space for immutable release exports
        if: runner.environment == 'github-hosted'
        # Archive restoration, generated pages and dependencies exceeded the
        # previous 35 GiB allowance. Keep 45 GiB before installing dependencies.
        run: node scripts/prepare-runner-space.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The export nearly fills the runner; do not retain or upload an npm
      # download cache alongside immutable releases and generated pages.
      - run: |
          npm ci
          npm cache clean --force
      - run: npm run omics:migrate
      - name: Verify reproducible migration
        run: git diff --exit-code -- data/omics/migrated.jsonl data/omics/scope-audit.jsonl
      - name: Test public-artifact review without network or private data
        run: python3 -m unittest discover -s scripts/omics/tests -p "test_*.py"
      - run: npm run test:omics
      - run: npm run build
      - name: Release intermediate Next build space
        # Static hosting uses out/. Keep generated types, exports and archives.
        run: |
          rm -rf .next/server .next/cache
          df -h .
      - run: npm run omics:check-export
  contributions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/omics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/omics/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npm run test:emulator
